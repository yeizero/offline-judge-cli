[package]
name = "editor"
version.workspace = true
edition.workspace = true

[dependencies]
shared = { path = "../shared" }
anyhow.workspace = true
argh = { version = "0.1.13", default-features = false, features = ["serde"] }
crossterm = "0.29.0"
either = "1.15.0"
ropey = "1.6.1"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.1"
fs-err = "3.1.2"
arboard = { version = "3.6.1", default-features = false, features = ["core-graphics", "wayland-data-control", "windows-sys", "wl-clipboard-rs"] }

