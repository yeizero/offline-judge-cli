[package]
name = "shared"
version = "0.1.0"
edition = "2024"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI", "Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
shlex = "1.3.0"

[target.'cfg(target_os = "macos")'.dependencies]
shlex = "1.3.0"

[dependencies]
anyhow = "1.0.100"
dunce = "1.0.5"
fs-err = "3.1.2"
memmap2 = "0.9.8"
musli = { version = "0.0.149", features = ["storage"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.47.1", features = ["process"] }
